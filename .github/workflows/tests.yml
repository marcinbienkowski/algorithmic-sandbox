name: Local Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: ubuntu-26.04
            os: ubuntu-26.04
          - name: debian-12
            os: ubuntu-latest
            container: debian:bookworm
          - name: debian-13
            os: ubuntu-latest
            container: debian:trixie
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash -e {0}

    steps:
      - uses: actions/checkout@v7

      - name: Install extra packages
        run: |
          sudo=$(command -v sudo || true)  # Debian containers have no sudo, but run as root
          $sudo apt-get update
          $sudo apt-get install -y build-essential ca-certificates clang-tidy cmake lcov rustc strace
          gcc --version
          rustc --version

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Python checks
        run: |
          uv sync
          uv run ruff check .
          uv run mypy .
          uv run ty check

      - name: Compile and lint
        run: |
          cmake .
          make -j$(nproc)
          make -j$(nproc) sandbox_coverage
          clang-tidy src/*.{h,cpp}

      - name: Run tests
        run: |
          ulimit -a
          uv run pytest -v tests

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage_report

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.name }}
          path: coverage_report

  local-tests:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success
